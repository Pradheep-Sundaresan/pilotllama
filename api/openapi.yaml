openapi: 3.1.0
info:
  title: PilotLlama Local HTTP API
  version: 1.0.0
  description: >-
    Loopback-only, OpenAI-style application API. This specification documents the
    supported subset; it is not a claim of complete OpenAI API compatibility.
servers:
  - url: http://127.0.0.1:8080
    description: Local Mac loopback
paths:
  /healthz:
    get:
      summary: Process liveness
      security: []
      responses:
        "200":
          description: The Go control plane is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { const: ok }
                  service: { const: inferno-controlplane }
  /readyz:
    get:
      summary: Admission and backend readiness
      security: []
      responses:
        "200":
          description: Ready to accept generation.
          content:
            application/json:
              schema:
                type: object
                required: [ready]
                properties:
                  ready: { const: true }
        "503":
          description: Backend unavailable or admission draining.
          content:
            application/json:
              schema:
                type: object
                required: [ready, reason]
                properties:
                  ready: { const: false }
                  reason:
                    enum: [backend_unavailable, admission_draining]
  /v1/models:
    get:
      summary: List the one live READY model alias
      responses:
        "200":
          description: Current model alias.
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: { const: list }
                  data:
                    type: array
                    minItems: 1
                    maxItems: 1
                    items: { $ref: "#/components/schemas/Model" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Overloaded" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/models/{model}:
    get:
      summary: Retrieve the live model alias
      parameters:
        - in: path
          name: model
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current model alias.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Requested alias is not loaded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429": { $ref: "#/components/responses/Overloaded" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/chat/completions:
    post:
      summary: Create a local chat completion
      description: >-
        With stream=true, returns SSE data records: chat.completion.chunk events,
        an optional namespaced pilotllama.metrics event, then data: [DONE].
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: JSON completion or SSE stream according to request.stream.
          headers:
            X-Request-ID:
              required: true
              schema: { type: string, pattern: "^[0-9]+$" }
            X-Queue-Position:
              required: false
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatCompletion" }
            text/event-stream:
              schema:
                type: string
                description: See docs/http-api.md for ordered event schemas.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "408":
          description: Request cancelled while a response remained writable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "413": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/Overloaded" }
        "502":
          description: Sanitized native or protocol failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504":
          description: Queue-wait or generation deadline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing or invalid local bearer token.
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    BadRequest:
      description: Invalid or unsupported request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Overloaded:
      description: Queue, rate, native, or public-operation capacity exceeded.
      headers:
        Retry-After:
          required: false
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unavailable:
      description: Backend unavailable or admission draining.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    Model:
      type: object
      additionalProperties: false
      required: [id, object, created, owned_by]
      properties:
        id: { type: string }
        object: { const: model }
        created: { type: "null" }
        owned_by: { const: inferno }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [message, type, param, code]
          properties:
            message: { type: string }
            type: { type: string }
            param: { type: "null" }
            code: { type: string }
    Message:
      type: object
      required: [role, content]
      properties:
        role:
          enum: [system, user, assistant, tool]
        content: { type: string }
        tool_call_id: { type: string }
        tool_calls:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/ToolCall" }
    ToolCall:
      type: object
      required: [id, type, function]
      properties:
        id: { type: string }
        type: { const: function }
        function:
          type: object
          required: [name, arguments]
          properties:
            name: { type: string }
            arguments: { type: string, description: JSON object encoded as a string }
    ToolDefinition:
      type: object
      required: [type, function]
      properties:
        type: { const: function }
        function:
          type: object
          required: [name, parameters]
          properties:
            name: { type: string }
            description: { type: string }
            parameters: { type: object }
    ChatRequest:
      type: object
      additionalProperties: false
      required: [model, messages]
      properties:
        model: { type: string, maxLength: 256 }
        messages:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/Message" }
        stream: { type: boolean, default: false }
        max_tokens: { type: integer, minimum: 1 }
        max_completion_tokens: { type: integer, minimum: 1 }
        temperature: { type: number, minimum: 0, maximum: 2, default: 0 }
        top_p: { type: number, exclusiveMinimum: 0, maximum: 1, default: 1 }
        top_k: { type: integer, minimum: 0, maximum: 100000, default: 0 }
        seed: { type: integer, minimum: 0, maximum: 4294967295 }
        stop:
          oneOf:
            - { type: string, minLength: 1, maxLength: 256 }
            - type: array
              maxItems: 4
              items: { type: string, minLength: 1, maxLength: 256 }
        n: { const: 1 }
        thinking: { type: boolean, default: false }
        tools:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/ToolDefinition" }
        tool_choice:
          enum: [none, auto, required]
        response_format:
          type: object
          description: See docs/http-api.md for text/json_object/json_schema bounds.
        pilotllama:
          type: object
          additionalProperties: false
          properties:
            include_metrics:
              type: boolean
              default: false
              description: Stream-only namespaced measurement receipt.
    ChatCompletion:
      type: object
      required: [id, object, created, model, choices]
      properties:
        id: { type: string }
        object: { const: chat.completion }
        created: { type: integer }
        model: { type: string }
        choices:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            required: [index, message, finish_reason]
            properties:
              index: { const: 0 }
              message:
                type: object
                required: [role, content]
                properties:
                  role: { const: assistant }
                  content: { type: string }
                  reasoning_content: { type: string }
                  tool_calls:
                    type: array
                    items: { $ref: "#/components/schemas/ToolCall" }
              finish_reason:
                enum: [stop, length, tool_calls]
              logprobs: { type: "null" }
security:
  - bearerAuth: []
